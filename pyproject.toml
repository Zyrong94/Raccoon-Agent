[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raccoon"
version = "0.1.0"
description = "An event-driven, asynchronous agent that runs in a local workspace with a web workbench."
requires-python = ">=3.11"
dependencies = [
    "mem0ai==2.2.1",
    "openai",
    "anyio",
    "jsonschema>=4.18,<5",
    "mcp>=1.28.1,<2",
    "python-dotenv",
    "PyYAML",
    "tomlkit",
    "portalocker",
    "pypdfium2>=5,<6",
    "Pillow>=11,<13",
    "beautifulsoup4>=4.12,<5",
    "tzdata>=2025.2",
    "tzlocal>=5,<6",
    "croniter>=6,<7",
    "ddgs>=9,<10",
]

[project.optional-dependencies]
qq = ["httpx>=0.27,<1", "websockets>=14,<16", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest", "httpx", "websockets>=14,<16", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
web = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
raccoon = "raccoon.interfaces.cli.main:main"

[tool.setuptools.packages.find]
include = ["raccoon*"]

[tool.setuptools.package-data]
raccoon = ["config/default_subagents/*/*.yaml", "config/default_subagents/*/*.md"]
"raccoon.modules.context" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 200
target-version = ["py311"]
